pick_action_task:
  ros__parameters:
    arm: panda2
    # Final fingertip-center grasp pose.
    grasp_x: 0.230000
    grasp_y: -0.040000
    grasp_z: 0.813000

    # Grasp orientation offsets relative to the initial end-effector orientation.
    # Unit: degrees.
    grasp_rx_deg: 10.000000
    grasp_ry_deg: 0.000000

    approach_distance: 0.050000
    lift_height: 0.050000

    # Completed final place/insert pose.
    place_x: 0.030800
    place_y: 0.032000
    place_z: 0.821000

    # Place orientation offsets relative to the initial end-effector orientation.
    # Unit: degrees.
    place_rx_deg: 10.000000
    place_ry_deg: 0.000000

    # Allowed: "+y", "-y", "+z", "-z"
    place_direction: "-z"
    place_distance: 0.050000

    # Retreat opposite to place_direction after release.
    retreat_distance: 0.080000

    gripper_open_width: 0.020000
    grasp_width: 0.007000

    open_and_lift_after_place: true

    velocity_scale: 0.35
    acceleration_scale: 0.25
    initial_settle_time: 0.5
    debug_mode: false
