handover_task:
  ros__parameters:
    # Receiving arm: panda1 or panda2.
    arm: panda1

    # Final fingertip-center regrasp pose.
    handover_x: 0.055000
    handover_y: -0.000000
    handover_z: 0.845000

    # Approach axis in gripper LOCAL frame, transformed by target orientation.
    approach_x: 0.000000
    approach_y: 0.000000
    approach_z: 1.000000
    approach_distance: 0.050000

    receiver_grasp_width: 0.035000
    giver_open_width: 0.080000
    giver_retreat_height: 0.050000

    # WORLD X rotation shared by end-effector orientation and approach direction.
    x_rotation_deg: 65.000000

    velocity_scale: 0.35
    acceleration_scale: 0.25
